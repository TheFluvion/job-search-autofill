<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>CV Autofill</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 13px/1.4 system-ui, -apple-system, sans-serif; margin: 0; padding: 12px; color: #1f2328; background: #f6f8fa; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    h2 { font-size: 13px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; color: #57606a; }
    section { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 10px; margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #57606a; margin: 6px 0 2px; }
    input, select, textarea { width: 100%; padding: 6px; border: 1px solid #d0d7de; border-radius: 6px; font: inherit; }
    textarea { min-height: 260px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
    button { padding: 7px 12px; border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa; cursor: pointer; font: inherit; }
    button.primary { background: #1f883d; color: #fff; border-color: #1a7f37; }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .status { margin-top: 8px; font-size: 12px; color: #57606a; white-space: pre-wrap; }
    .status.error { color: #cf222e; }
    details summary { cursor: pointer; font-weight: 600; }
    ul.report { list-style: none; padding: 0; margin: 6px 0 0; }
    ul.report li { padding: 6px; border-radius: 6px; margin-bottom: 4px; cursor: pointer; border-left: 4px solid; background: #f6f8fa; }
    ul.report li:hover { background: #eaeef2; }
    ul.report li.ok { border-color: #1f883d; }
    ul.report li.low { border-color: #d4a72c; }
    ul.report li.bad { border-color: #cf222e; }
    ul.report .lbl { font-weight: 600; }
    ul.report .meta { font-size: 11px; color: #57606a; word-break: break-word; }
    .counts { font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>CV Autofill</h1>

  <section>
    <details id="settingsBox">
      <summary>Configuración IA</summary>
      <label for="provider">Proveedor</label>
      <select id="provider">
        <option value="claude">Claude</option>
        <option value="gemini">Gemini</option>
      </select>
      <label for="apiKey">API key</label>
      <input id="apiKey" type="password" autocomplete="off" />
      <label for="model">Modelo</label>
      <input id="model" type="text" />
      <div class="row"><button id="saveSettings">Guardar</button></div>
      <div id="settingsStatus" class="status"></div>
    </details>
  </section>

  <section>
    <h2>CV</h2>
    <input id="cvFile" type="file" accept="application/pdf" />
    <div class="row"><button id="parseBtn">Parsear CV</button></div>
    <label for="profile">Perfil (JSON editable)</label>
    <textarea id="profile" spellcheck="false"></textarea>
    <div class="row"><button id="saveProfile">Guardar perfil</button></div>
    <div id="cvStatus" class="status"></div>
  </section>

  <section>
    <h2>Llenar formulario</h2>
    <label><input id="useScreenshot" type="checkbox" style="width:auto" /> Enviar captura como contexto</label>
    <div class="row"><button id="fillBtn" class="primary">Llenar</button></div>
    <div id="fillStatus" class="status"></div>
  </section>

  <section>
    <h2>Reporte</h2>
    <div id="reportMeta" class="counts"></div>
    <h2 style="margin-top:8px">No llenados</h2>
    <ul id="unfilledList" class="report"></ul>
    <details>
      <summary>Llenados</summary>
      <ul id="filledList" class="report"></ul>
    </details>
  </section>

  <script type="module" src="panel.js"></script>
</body>
</html>
